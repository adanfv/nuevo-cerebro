#app{max-width:480px;margin:0 auto;padding:1rem}
.card{background:rgba(255,255,255,0.7);border:1px solid rgba(74,122,80,0.25);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.btn{padding:8px 16px;border-radius:20px;border:none;cursor:pointer;font-weight:700;font-size:12px;transition:all .2s}
.btn-primary{background:#4a7a50;color:#fff}
.btn-secondary{background:rgba(255,255,255,0.5);color:#5a7a5e;border:1px solid rgba(74,122,80,0.25)}
.tab-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.sec-header{background:#4a7a50;color:#fff;padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}

.check-box.done{background:#4a7a50;border-color:#4a7a50}
.check-text{font-size:13px;font-weight:500}
.check-text.done{color:rgba(42,90,50,0.4);text-decoration:line-through}
.check-hora{font-size:9px;color:#2d5a32;opacity:.7;font-weight:600}
.progress-bar{background:rgba(74,122,80,0.15);border-radius:6px;height:8px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:6px;background:#4a7a50;transition:width .5s}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem}
.index-box{background:rgba(255,255,255,0.7);border:1px solid rgba(74,122,80,0.25);border-radius:12px;padding:6px 12px;text-align:right}
.esfera-btn{padding:5px 10px;border-radius:16px;font-size:10px;cursor:pointer;font-weight:400;background:rgba(255,255,255,0.5);border:1px solid rgba(74,122,80,0.25);color:#5a7a5e;margin:3px}
.esfera-btn.active{background:#4a7a50;color:#fff;font-weight:700}
.item-row{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;border-bottom:1px solid rgba(74,122,80,0.15)}
.prio-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.deuda-bar{background:rgba(74,122,80,0.15);border-radius:4px;height:5px;margin:8px 0}
.deuda-fill{height:100%;border-radius:4px;background:#4a7a50}
input,select{font-size:12px;padding:6px 9px;border-radius:8px;border:1px solid rgba(74,122,80,0.3);background:rgba(255,255,255,0.7);color:#1a2e1c;outline:none;width:100%}
.chat-msg{max-width:82%;padding:9px 13px;border-radius:12px;font-size:12px;line-height:1.6;margin-bottom:8px}
.chat-user{background:#4a7a50;color:#fff;margin-left:auto}
.chat-bot{background:rgba(255,255,255,0.7);border:1px solid rgba(74,122,80,0.25)}
.semana-card{background:rgba(255,255,255,0.7);border:1px solid rgba(74,122,80,0.25);border-radius:14px;padding:14px;margin-bottom:12px}
.dia-circle{width:28px;height:28px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700}
</style>

    {id:402,t:"🌐 META: Emprendimiento digital",p:"meta",e:"pendiente"},

const RCHECK_INIT=[
  {id:"r1",t:"Gesto o detalle hacia Denisse"},
  {id:"r2",t:"Momento con Iker"},
  {id:"r3",t:"Momento con Missouri"},
  {id:"r4",t:"Comunicación proactiva en el trabajo"}
];

const PC={urgente:"#c0392b",importante:"#b07800",meta:"#4a7a50"};

// ── STATE ─────────────────────────────────────────────────────────────────────
let STATE={
  tab:"checklist",
  esfera:"finanzas",
  finTab:"items",
  niveles:{finanzas:5,proyectos:5,salud:5,emocional:5,personal:5,profesional:5,relaciones:5,proposito:5},
  items:JSON.parse(JSON.stringify(ITEMS_INIT)),
  deudas:JSON.parse(JSON.stringify(DEUDAS_INIT)),
  checks:{},
  relChecks:{},
  secOpen:{},
  chat:[],
  historial:{},
  abonoInput:{}
};

// Cargar desde localStorage
const saved=LS.get(K.main);
if(saved){
  if(saved.niveles) STATE.niveles=saved.niveles;
  if(saved.items) STATE.items=saved.items;
  if(saved.deudas) STATE.deudas=saved.deudas;
  if(saved.chat) STATE.chat=saved.chat;
  if(saved.historial) STATE.historial=saved.historial;
}
const ck=LS.get(K.checks); if(ck) STATE.checks=ck;
const rl=LS.get(K.rel); if(rl) STATE.relChecks=rl;

function saveMain(){
  LS.set(K.main,{niveles:STATE.niveles,items:STATE.items,deudas:STATE.deudas,chat:STATE.chat,historial:STATE.historial});
}
function saveCk(){LS.set(K.checks,STATE.checks)}
function saveRl(){LS.set(K.rel,STATE.relChecks)}

const hoy=hoyISO();
const ckKey=(s,i)=>`${hoy}-${s}-${i}`;
const isCk=(s,i)=>!!STATE.checks[ckKey(s,i)];
const isRl=(id)=>!!STATE.relChecks[`${hoy}-rel-${id}`];

// Calcular progreso
function getProgress(){
  const sAct=SECCIONES.filter(s=>!EXCLUIR.includes(s.id));
  const total=sAct.flatMap(s=>s.items).length;
  const done=sAct.flatMap(s=>s.items.filter(i=>isCk(s.id,i.id))).length;
  return{total,done,pct:total?Math.round(done/total*100):0};
}

function promedio(){
  const v=Object.values(STATE.niveles);
  return Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10;
}

// Semanas para historial
function getSemanaKey(fecha){
  const d=new Date(fecha+"T12:00:00"),day=d.getDay();
  const diff=d.getDate()-(day===0?6:day-1);
  const l=new Date(d.setDate(diff));
  return l.toISOString().split("T")[0];
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  const app=document.getElementById("app");
  const pr=getProgress();
  const prom=promedio();
  const promColor=prom>=7?"#4a7a50":prom>=5?"#b07800":"#c0392b";
  const fechaFull=new Date().toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

  // Guardar snapshot del día en historial
  STATE.historial[hoy]={...STATE.historial[hoy],...STATE.niveles,ckTotal:pr.total,ckDone:pr.done};
  saveMain();

  let html=`
  <div class="header">
    <div>
      <div style="font-size:20px;font-weight:700;color:#2d5a32">🧠 Nuevo Cerebro</div>
      <div style="font-size:10px;color:#5a7a5e;margin-top:2px;text-transform:capitalize">${fechaFull}</div>
    </div>
    <div class="index-box">
      <div style="font-size:22px;font-weight:700;color:${promColor};line-height:1">${prom}</div>
      <div style="font-size:8px;color:#5a7a5e;text-transform:uppercase">índice vida</div>
    </div>
  </div>
  <div class="tab-bar">
    ${[["checklist","✅ Mi Día"],["esferas","🌐 Esferas"],["historial","📈 Historial"],["chat","🧠 IA"]].map(([id,lbl])=>
      `<button class="btn ${STATE.tab===id?"btn-primary":"btn-secondary"}" onclick="setTab('${id}')">${lbl}</button>`
    ).join("")}
  </div>`;

  // ── MI DÍA ──
  if(STATE.tab==="checklist"){
    html+=`<div class="card">
      <div style="font-size:15px;font-weight:700;color:#2d5a32;text-transform:capitalize;margin-bottom:4px">${fechaFull}</div>
      ${esVacac()?'<div style="font-size:9px;color:#b07800;margin-bottom:4px">☀️ Periodo vacacional — Horario 7am</div>':""}
      <div style="display:flex;justify-content:space-between;margin-bottom:4px">
        <span style="font-size:11px;color:#5a7a5e">Progreso del día</span>
        <span style="font-size:11px;font-weight:700;color:#4a7a50">${pr.done}/${pr.total} — ${pr.pct}%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pr.pct}%"></div></div>
      ${pr.pct===100?'<div style="text-align:center;font-size:12px;color:#2d5a32;font-weight:700;margin-top:6px">🎉 ¡Día completado!</div>':""}
    </div>`;

    SECCIONES.forEach((sec,si)=>{
      const bg=si%2===0?"sec-body-a":"sec-body-b";
      const hechas=sec.items.filter(i=>isCk(sec.id,i.id)).length;
      const excluida=EXCLUIR.includes(sec.id);
      const abierta=STATE.secOpen[sec.id]!==false;
      html+=`<div style="border-radius:11px;margin-bottom:6px;overflow:hidden;box-shadow:0 1px 3px rgba(42,90,50,.1)">
        <div class="sec-header" onclick="toggleSec('${sec.id}')">
          <span>${sec.label}${excluida?" ⏸":""}</span>
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:10px;padding:1px 7px;border-radius:10px;background:rgba(255,255,255,0.25);font-weight:600">${hechas}/${sec.items.length}</span>
            <span style="font-size:11px;opacity:.8">${abierta?"▲":"▼"}</span>
          </div>
        </div>`;
      if(abierta){
        html+=`<div class="${bg}">`;
        sec.items.forEach(item=>{
          const done=isCk(sec.id,item.id);
          html+=`<div class="check-item" onclick="${excluida?"":"togCk('"+sec.id+"','"+item.id+"')"}">
            <div class="check-box${done?" done":""}">${done?"<span style='font-size:10px;color:#fff;font-weight:700'>✓</span>":""}</div>
            <div>
              <div class="check-text${done?" done":""}">${item.t}</div>
              ${item.h?`<div class="check-hora">🕐 ${item.h}</div>`:""}
            </div>
          </div>`;
        });
        html+=`<div style="display:flex;gap:6px;padding:7px 12px;background:rgba(255,255,255,0.3)">
          <input id="add-${sec.id}" placeholder="+ Agregar ítem..." onkeydown="if(event.key==='Enter')addCkItem('${sec.id}')" style="flex:1"/>
          <button class="btn btn-primary" style="padding:5px 10px;font-size:11px" onclick="addCkItem('${sec.id}')">+</button>
        </div></div>`;
      }
      html+="</div>";
    });
  }

  // ── ESFERAS ──
  if(STATE.tab==="esferas"){
    html+=`<div style="display:flex;flex-wrap:wrap;margin-bottom:12px">`;
    ESFERAS.forEach(e=>{
      html+=`<button class="esfera-btn${STATE.esfera===e.id?" active":""}" onclick="setEsfera('${e.id}')">${e.icon} ${e.label}</button>`;
    });
    html+="</div>";

    const esf=ESFERAS.find(e=>e.id===STATE.esfera);
    const nivel=STATE.niveles[STATE.esfera]||5;
    html+=`<div class="card" style="background:#ccdece;border-color:#4a7a5044">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:8px"><span style="font-size:22px">${esf.icon}</span><span style="font-size:14px;font-weight:700;color:#2d5a32">${esf.label}</span></div>
        <span style="font-size:20px;font-weight:700;color:#4a7a50">${nivel}<span style="font-size:10px;color:#5a7a5e">/10</span></span>
      </div>
      <input type="range" min="1" max="10" value="${nivel}" oninput="setNivel('${STATE.esfera}',this.value)" style="width:100%;accent-color:#4a7a50"/>
    </div>`;

    if(STATE.esfera==="finanzas"){
      html+=`<div style="display:flex;gap:5px;margin-bottom:10px">
        ${[["items","Objetivos"],["deudas","Deudas"],["gastos","Gastos"]].map(([id,lbl])=>
          `<button class="btn ${STATE.finTab===id?"btn-primary":"btn-secondary"}" onclick="setFinTab('${id}')">${lbl}</button>`
        ).join("")}
      </div>`;

      if(STATE.finTab==="deudas"){
        STATE.deudas.forEach(d=>{
          const total=d.m+d.e,pend=total-d.ab,pct=Math.round(d.ab/total*100);
          html+=`<div class="card" style="border-left:3px solid #c0392b">
            <div style="display:flex;justify-content:space-between;margin-bottom:6px">
              <div><div style="font-size:13px;font-weight:600">${d.a}</div><div style="font-size:10px;color:#5a7a5e">${d.n}</div></div>
              <div style="text-align:right"><div style="font-size:14px;font-weight:700;color:#c0392b">$${pend.toLocaleString()}</div><div style="font-size:9px;color:#5a7a5e">de $${total.toLocaleString()}</div></div>
            </div>
            <div class="deuda-bar"><div class="deuda-fill" style="width:${pct}%"></div></div>
            <div style="display:flex;gap:6px;margin-top:4px">
              <input type="number" id="ab-${d.id}" placeholder="Abono $" style="flex:1"/>
              <button class="btn btn-primary" style="padding:5px 12px;font-size:11px" onclick="abonar(${d.id})">+ Abonar</button>
            </div>
          </div>`;
        });
        const totalD=STATE.deudas.reduce((s,d)=>s+d.m+d.e-d.ab,0);
        html+=`<div class="card" style="background:#ccdece"><div style="display:flex;justify-content:space-between"><span style="color:#5a7a5e">Total pendiente</span><span style="font-size:20px;font-weight:700;color:#c0392b">$${totalD.toLocaleString()}</span></div></div>`;
      }

      if(STATE.finTab==="gastos"){
        GASTOS.forEach(g=>{
          html+=`<div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-left:3px solid ${g.u?"#c0392b":"#7aaa7e"}">
            <div><div style="font-size:12px;font-weight:500">${g.l}</div></div>
            <div style="font-size:13px;font-weight:700;color:${g.u?"#c0392b":"#b07800"}">$${g.m.toLocaleString()}</div>
          </div>`;
        });
        const totalG=GASTOS.reduce((s,g)=>s+g.m,0);
        html+=`<div class="card" style="background:#ccdece"><div style="display:flex;justify-content:space-between"><span style="color:#5a7a5e">Total mensual</span><span style="font-size:20px;font-weight:700;color:#b07800">$${totalG.toLocaleString()}</span></div></div>`;
      }
    }

    // Check relaciones
    if(STATE.esfera==="relaciones"){
      html+=`<div class="card" style="background:#ccdece;margin-bottom:10px">
        <div style="font-size:11px;font-weight:700;color:#2d5a32;margin-bottom:8px">📋 Check diario</div>`;
      RCHECK_INIT.forEach(item=>{
        const done=isRl(item.id);
        html+=`<div class="check-item" onclick="togRl('${item.id}')">
          <div class="check-box${done?" done":""}">${done?"<span style='font-size:10px;color:#fff;font-weight:700'>✓</span>":""}</div>
          <div class="check-text${done?" done":""}">${item.t}</div>
        </div>`;
      });
      html+="</div>";
    }

    // Items esfera
    if(STATE.esfera!=="finanzas"||(STATE.esfera==="finanzas"&&STATE.finTab==="items")){
      const items=STATE.items[STATE.esfera]||[];
      items.forEach(item=>{
        const estados={pendiente:"○","en progreso":"◑",hecho:"●"};
        const eColor={pendiente:"#5a7a5e","en progreso":"#b07800",hecho:"#4a7a50"};
        html+=`<div class="card" style="padding:10px 12px;border-left:3px solid ${PC[item.p]||"#5a7a5e"};opacity:${item.e==="hecho"?.4:1}">
          <div class="item-row" style="padding:0;border:none">
            <button onclick="togEstado('${STATE.esfera}',${item.id})" style="background:none;border:none;cursor:pointer;font-size:15px;color:${eColor[item.e]};flex-shrink:0">${estados[item.e]}</button>
            <div style="flex:1">
              <div style="font-size:12px;text-decoration:${item.e==="hecho"?"line-through":"none"}">${item.t}</div>
              <div style="font-size:9px;color:${PC[item.p]};margin-top:2px;font-weight:600">● ${item.p}</div>
            </div>
            <button onclick="delItem('${STATE.esfera}',${item.id})" style="background:none;border:none;cursor:pointer;color:rgba(42,90,50,.25);font-size:12px">✕</button>
          </div>
        </div>`;
      });
      html+=`<div class="card" style="border-style:dashed;border-color:#7aaa7e">
        <input id="new-item-txt" placeholder="Objetivo o meta..." style="margin-bottom:6px"/>
        <div style="display:flex;gap:6px">
          <select id="new-item-prio" style="flex:1"><option value="urgente">Urgente</option><option value="importante" selected>Importante</option><option value="meta">Meta</option></select>
          <button class="btn btn-primary" onclick="addItem('${STATE.esfera}')">+ Agregar</button>
        </div>
      </div>
      <div style="font-size:9px;color:#5a7a5e;text-align:center;margin-top:4px">Toca ○ para cambiar estado</div>`;
    }
  }

  // ── HISTORIAL ──
  if(STATE.tab==="historial"){
    const dias=Object.keys(STATE.historial).sort().slice(-14);
    if(dias.length===0){
      html+=`<div class="card" style="text-align:center;color:#5a7a5e;padding:2rem">Empieza a marcar tu checklist hoy y aquí verás tu progreso.</div>`;
    } else {
      // Agrupar por semana
      const semMap={};
      dias.forEach(fecha=>{
        const sk=getSemanaKey(fecha);
        if(!semMap[sk]) semMap[sk]={dias:[]};
        const reg=STATE.historial[fecha]||{};
        const cp=reg.ckTotal?Math.round(reg.ckDone/reg.ckTotal*100):0;
        semMap[sk].dias.push({fecha,cp,esHoy:fecha===hoy});
      });
      Object.entries(semMap).sort(([a],[b])=>b.localeCompare(a)).forEach(([sk,sem])=>{
        const avg=sem.dias.length?Math.round(sem.dias.reduce((s,d)=>s+d.cp,0)/sem.dias.length):0;
        const esAct=sem.dias.some(d=>d.esHoy);
        const l=new Date(sk+"T12:00:00"),do2=new Date(l);do2.setDate(l.getDate()+6);
        const lbl=`${l.toLocaleDateString("es-MX",{day:"2-digit",month:"short"})} — ${do2.toLocaleDateString("es-MX",{day:"2-digit",month:"short"})}`;
        html+=`<div class="semana-card" style="border-color:${esAct?"#4a7a5088":"rgba(74,122,80,0.25)"}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <div>
              <div style="font-size:11px;font-weight:700;color:${esAct?"#2d5a32":"#5a7a5e"}">${esAct?"📅 Semana actual":"📅 "+lbl}</div>
              ${!esAct?`<div style="font-size:9px;color:#5a7a5e">${lbl}</div>`:""}
            </div>
            <div style="text-align:center"><div style="font-size:15px;font-weight:700;color:#4a7a50">${avg}%</div><div style="font-size:8px;color:#5a7a5e">checklist</div></div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:8px">
            ${["L","M","X","J","V","S","D"].map((dn,di)=>{
              const dd=sem.dias.find(d=>{const dw=new Date(d.fecha+"T12:00:00").getDay();return(dw===0?6:dw-1)===di});
              if(dd){
                const color=dd.cp>=80?"#2d5a32":dd.cp>=50?"#b07800":"#c0392b";
                return `<div style="text-align:center">
                  <div style="font-size:8px;color:#5a7a5e;margin-bottom:2px">${dn}</div>
                  <div class="dia-circle" style="background:${dd.esHoy?"#4a7a50":"#ccdece"};color:${dd.esHoy?"#fff":color};border:${dd.esHoy?"2px solid #2d5a32":"1px solid rgba(74,122,80,0.3)"}">${dd.cp}%</div>
                </div>`;
              }
              return `<div style="text-align:center"><div style="font-size:8px;color:#5a7a5e;margin-bottom:2px">${dn}</div><div class="dia-circle" style="background:rgba(74,122,80,0.08);border:1px dashed rgba(74,122,80,0.2);color:rgba(74,122,80,0.3)">—</div></div>`;
            }).join("")}
          </div>
          <div style="padding:6px 10px;border-radius:8px;background:#ccdece;display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:10px;color:#5a7a5e">Calificación</span>
            <span style="font-size:11px;font-weight:700;color:${avg>=80?"#2d5a32":avg>=50?"#b07800":"#c0392b"}">${avg>=80?"🟢 Excelente":avg>=50?"🟡 Bien":"🔴 Mejorar"} — ${avg}%</span>
          </div>
        </div>`;
      });
    }
  }

  // ── CHAT IA ──
  if(STATE.tab==="chat"){
    html+=`<div id="chat-box" style="min-height:240px;max-height:360px;overflow-y:auto;display:flex;flex-direction:column;margin-bottom:10px">`;
    if(STATE.chat.length===0){
      html+=`<div class="card" style="text-align:center;margin-top:16px"><div style="font-size:24px;margin-bottom:6px">🧠</div><div style="font-size:13px;font-weight:600;color:#2d5a32;margin-bottom:3px">Hola Adán</div><div style="font-size:11px;color:#5a7a5e">Tu cerebro conoce tu estado, proyectos y deudas.</div></div>`;
    }
    STATE.chat.forEach(m=>{
      html+=`<div class="chat-msg ${m.r==="user"?"chat-user":"chat-bot"}">${m.c}</div>`;
    });
    html+=`</div>
    <div style="display:flex;gap:7px">
      <input id="chat-inp" placeholder="¿Qué quieres reflexionar?" onkeydown="if(event.key==='Enter')sendChat()" style="flex:1;border-radius:20px"/>
      <button class="btn btn-primary" style="border-radius:20px;padding:9px 14px" onclick="sendChat()">Enviar</button>
    </div>`;
  }

  app.innerHTML=html;
  // Scroll al fondo del chat
  const cb=document.getElementById("chat-box");
  if(cb) cb.scrollTop=cb.scrollHeight;
}

// ── ACCIONES ──────────────────────────────────────────────────────────────────
function setTab(t){STATE.tab=t;render()}
function setEsfera(e){STATE.esfera=e;render()}
function setFinTab(t){STATE.finTab=t;render()}
function toggleSec(id){STATE.secOpen[id]=STATE.secOpen[id]===false?true:false;render()}
function setNivel(esfera,v){STATE.niveles[esfera]=+v;saveMain();render()}

function togCk(s,i){
  const k=ckKey(s,i);STATE.checks[k]=!STATE.checks[k];
  saveCk();render();
}
function togRl(id){
  const k=`${hoy}-rel-${id}`;STATE.relChecks[k]=!STATE.relChecks[k];
  saveRl();render();
}
function addCkItem(sid){
  const inp=document.getElementById("add-"+sid);
  if(!inp||!inp.value.trim()) return;
  const sec=SECCIONES.find(s=>s.id===sid);
  if(sec) sec.items.push({id:"c"+Date.now(),t:inp.value.trim(),h:""});
  render();
}
function togEstado(esfera,id){
  const items=STATE.items[esfera]||[];
  const item=items.find(x=>x.id===id);
  if(!item) return;
  item.e=item.e==="hecho"?"pendiente":item.e==="pendiente"?"en progreso":"hecho";
  saveMain();render();
}
function delItem(esfera,id){
  STATE.items[esfera]=(STATE.items[esfera]||[]).filter(x=>x.id!==id);
  saveMain();render();
}
function addItem(esfera){
  const txt=document.getElementById("new-item-txt");
  const prio=document.getElementById("new-item-prio");
  if(!txt||!txt.value.trim()) return;
  if(!STATE.items[esfera]) STATE.items[esfera]=[];
  STATE.items[esfera].push({id:Date.now(),t:txt.value.trim(),p:prio?prio.value:"importante",e:"pendiente"});
  saveMain();render();
}
function abonar(id){
  const inp=document.getElementById("ab-"+id);
  if(!inp) return;
  const m=parseFloat(inp.value);
  if(!m||m<=0) return;
  const d=STATE.deudas.find(x=>x.id===id);
  if(d) d.ab=Math.min(d.ab+m,d.m+d.e);
  saveMain();render();
}

async function sendChat(){
  const inp=document.getElementById("chat-inp");
  if(!inp||!inp.value.trim()) return;
  const msg=inp.value.trim();inp.value="";
  STATE.chat.push({r:"user",c:msg});
  render();
  const rs=ESFERAS.map(e=>`${e.label}: ${STATE.niveles[e.id]||5}/10`).join(", ");
  const dr=STATE.deudas.map(d=>`${d.a}: $${(d.m+d.e-d.ab).toLocaleString()}`).join(", ");
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:800,
        system:`Eres el "Nuevo Cerebro" de Adán Federico, 49 años, vendedor inmobiliario México. Directo, cálido. Estado: ${rs}. Deudas: ${dr}. Máx 3 párrafos.`,
        messages:STATE.chat.map(m=>({role:m.r==="user"?"user":"assistant",content:m.c}))})
    });
    const data=await res.json();
    const reply=data.content?.map(b=>b.text||"").join("")||"Sin respuesta.";
    STATE.chat.push({r:"bot",c:reply});
  }catch(e){
    STATE.chat.push({r:"bot",c:"Error de conexión. Intenta de nuevo."});
  }
  saveMain();render();
}

// Iniciar
render();
</script>
</body>
</html>
